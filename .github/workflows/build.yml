name: Build APK — SENSIS GOOD FF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle y generar wrapper
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-8.0-bin.zip" -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-8.0/bin/gradle wrapper --gradle-version 8.0 --project-dir .

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Build APK Release
        run: ./gradlew assembleRelease --no-daemon

      - name: Decodificar keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > sensis-key.jks

      - name: Firmar APK con apksigner
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks sensis-key.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEY_PASS }}" \
            --key-pass pass:"${{ secrets.KEY_PASS }}" \
            --out app/build/outputs/apk/release/SENSIS-GOOD-FF-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verificar firma
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify \
            app/build/outputs/apk/release/SENSIS-GOOD-FF-signed.apk \
            && echo "✅ APK firmado correctamente"

      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: SENSIS-GOOD-FF-v2-SIGNED
          path: app/build/outputs/apk/release/SENSIS-GOOD-FF-signed.apk
