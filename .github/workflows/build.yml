name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Sign APK
        run: |
          keytool -genkeypair -v \
            -keystore key.jks \
            -alias sensisgoodff \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass sensisgoodff123 \
            -keypass sensisgoodff123 \
            -dname "CN=SENSIS,OU=FF,O=SENSIS,L=MX,ST=MX,C=MX"

          $ANDROID_HOME/build-tools/33.0.1/zipalign -f -v 4 \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/app-aligned.apk

          $ANDROID_HOME/build-tools/33.0.1/apksigner sign \
            --ks key.jks \
            --ks-key-alias sensisgoodff \
            --ks-pass pass:sensisgoodff123 \
            --key-pass pass:sensisgoodff123 \
            --out app/build/outputs/apk/debug/SensisFF-signed.apk \
            app/build/outputs/apk/debug/app-aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SensisFF-Sensor
          path: app/build/outputs/apk/debug/SensisFF-signed.apk
